<!doctype html>
<html lang="en">
	<head>
		<base href="/" />
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Shop</title>
		<meta name="description" content="Ecommerce App developed using PERN stack." />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Ecommerce App" />
		<meta property="og:description" content="Ecommerce App developed using PERN stack." />
		<!-- temporary: using raw.githubusercontent.com for image since some old social media crawlers dont support relative paths. -->
		<!-- not using the deployed app url as well since i might change the hosting provider in future. -->
		<meta property="og:image" content="https://raw.githubusercontent.com/amanx5/ecommerce/main/ui/public/og-image.png" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:title" content="Ecommerce App" />
		<meta property="twitter:description" content="Ecommerce App developed using PERN stack." />
		<meta property="twitter:image" content="https://raw.githubusercontent.com/amanx5/ecommerce/main/ui/public/og-image.png" />

		<!-- fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@400;500;700&display=swap"
		/>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
